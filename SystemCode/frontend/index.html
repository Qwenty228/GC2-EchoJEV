<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Spoof Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Voice spoof check</h1>
      <p class="muted" id="model">Loading model…</p>
    </header>

    <form id="form">
      <label class="drop" for="file">
        <input id="file" name="file" type="file" accept=".wav,.flac,.ogg,.mp3,audio/*" required>
        <span id="file-name">Choose a voice clip (WAV, FLAC, OGG or MP3, up to 60 s)</span>
      </label>
      <audio id="player" controls hidden></audio>
      <button type="submit" id="submit" disabled>Check</button>
    </form>

    <section id="result" hidden>
      <p class="verdict" id="verdict"></p>
      <dl>
        <dt>Score</dt><dd id="score"></dd>
        <dt>Threshold</dt><dd id="threshold"></dd>
        <dt>Model</dt><dd id="system"></dd>
        <dt>Time</dt><dd id="latency"></dd>
      </dl>
      <details>
        <summary>Evidence</summary>
        <pre id="evidence"></pre>
      </details>
    </section>

    <p class="error" id="error" hidden></p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (x, d = 3) => Number(x).toFixed(d);

    fetch("/api/model")
      .then((r) => (r.ok ? r.json() : r.json().then((e) => Promise.reject(e.detail))))
      .then((m) => { $("model").textContent = `${m.system} · ${m.model_version}`; })
      .catch((e) => { $("model").textContent = String(e); });

    $("file").addEventListener("change", () => {
      const f = $("file").files[0];
      $("file-name").textContent = f ? f.name : "Choose a voice clip";
      $("submit").disabled = !f;
      if (f) { $("player").src = URL.createObjectURL(f); $("player").hidden = false; }
    });

    $("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("error").hidden = true;
      $("submit").disabled = true;
      $("submit").textContent = "Checking…";
      try {
        const body = new FormData();
        body.append("file", $("file").files[0]);
        const r = await fetch("/api/detect", { method: "POST", body });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || r.statusText);
        const real = data.label === "bonafide";
        $("verdict").textContent = real ? "Likely real (bona fide)" : "Likely fake (spoof)";
        $("verdict").className = "verdict " + (real ? "real" : "fake");
        $("score").textContent = fmt(data.score);
        $("threshold").textContent = fmt(data.threshold);
        $("system").textContent = `${data.system} · ${data.model_version}`;
        $("latency").textContent = `${fmt(data.latency_ms, 0)} ms for ${fmt(data.duration_s, 1)} s of audio`;
        $("evidence").textContent = JSON.stringify(data.evidence, null, 2);
        $("result").hidden = false;
      } catch (e) {
        $("error").textContent = e.message;
        $("error").hidden = false;
      } finally {
        $("submit").disabled = false;
        $("submit").textContent = "Check";
      }
    });
  </script>
</body>
</html>
