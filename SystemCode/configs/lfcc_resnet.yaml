# Stage 4: sequence-aware backend over a [B, 1, D, T] feature tensor.
defaults: {data: configs/data.yaml, features: configs/features.yaml}

representation: feat_b_lfcc_full

model:
  name: resnet18_1ch
  stem: {kernel: [3, 3], stride: [1, 1], channels: 16}
  stages: [2, 2, 2, 2]
  widths: [16, 32, 64, 128]
  pooling: statistics          # mean | statistics | attentive
  embedding_dim: 256
  dropout: 0.2

train:
  device: auto                 # cuda | mps | cpu
  epochs: 30
  batch_size: 32
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  early_stopping: {monitor: dev_eer, patience: 5, mode: min}
  seeds: [1337, 1338, 1339]
  amp: false                   # MPS: keep fp32 until verified

eval:
  metrics: [eer, roc_auc, pr_auc, f1, brier]
  per_attack_breakdown: true
  threshold_source: dev        # NEVER the eval set
