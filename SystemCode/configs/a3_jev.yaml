# A3: frozen A2 + the JEV API, on a stratified dev subset (E5, A2-vs-A3).
#
# `a2_experiment` points at the A2 dev-scoring run whose scores and dev EER threshold A3 uses
# (`runs/<a2 exp id>/scores/dev.csv`, columns clip_id,label,score,attack_id).
a2_experiment: runs/E-20261001-e1-a2-raw   # frozen WavLM Base+ head, E1 (2026-10-01)

sample_rate: 16000

subset:
  manifest: data/manifests/dev.csv
  n: 500
  seed: 1337
  strata: [label, attack_id]

variants:
  state: [numbers, words]
  question_set: [noul_only, all3]

client:
  kind: dry-run          # dry-run | typesafe
  route: typesafe        # typesafe | jev-ai.pro (used once kind: typesafe)
  model_version: unknown # set once the JEV docs name a real model version

# Detector-level and acoustic-evidence thresholds, applied in code (never learned).
#
# `detector.eer_threshold` is an EXPLICIT OVERRIDE ONLY — its default is `null`, meaning
# "read it from <a2_experiment>/metrics.json instead" (audio_df.pipelines.run_a3.
# resolve_eer_threshold: prefers testsets.dev.eer_threshold, falls back to
# threshold_source.value). The runner refuses to start with an actionable
# "score the A2 experiment first" message if that metrics.json does not exist yet. Only
# set this to a real number for a dry-run/dev smoke test that has no real A2 metrics.json.
thresholds:
  detector:
    eer_threshold: null
    # TODO (user, deferred 2026-10-04): these margins are placeholders. A2 scores span about
    # -40 to +30 logits, so only 0.10 % of dev clips fall within +-0.2 of the threshold and the
    # five levels collapse to two (docs/report/10_where_jev_fits.md, notebook 20 cell 43).
    # Rescale (e.g. from dev score percentiles) before E5. E5 on ASVspoof dev also cannot test
    # the In-the-Wild calibration problem.
    margins: [0.05, 0.2]   # (m1, m2); see audio_df.models.jev.state._level_word
    confidence_words: [low, medium, high]
  acoustic:
    high_band_hz: 4000
    high_band: [0.05, 0.15]
    high_band_words: [low, medium, high]
    silence_top_db: 30
    silence: [0.05, 0.2]
    silence_words: [little, some, "a lot"]
    duration: [2.0, 6.0]
    duration_words: [short, medium, long]

cache_dir: data/jev_cache
