# Dataset location and protocol. No path here is assumed to exist: code must fail loudly
# with an actionable message when data is absent, and tests must run without it.
dataset:
  name: asvspoof2019_la
  root: data/raw/ASVspoof2019/LA        # gitignored; set to your local download
  notes: >-
    Training corpus. train 25,380 / dev 24,844 / eval 71,237. Attacks A01-A06 in train/dev,
    A07-A19 only in eval (unseen). About 1 bona fide per 9 spoof. Leading silence leaks the label, so
    all splits are trimmed. The folders also hold 838 speaker-verification enrollment clips
    (LA_D_A*, LA_E_A*) that are not in the CM protocol and are never used.
  protocol_dir: data/raw/ASVspoof2019/LA/ASVspoof2019_LA_cm_protocols
  splits:
    train: ASVspoof2019.LA.cm.train.trn.txt
    dev: ASVspoof2019.LA.cm.dev.trl.txt
    eval: ASVspoof2019.LA.cm.eval.trl.txt

manifest:
  out_dir: data/manifests
  columns:                              # Stage 0 requires all of these
    - utt_id
    - path
    - label            # bonafide | spoof
    - speaker_id
    - attack_id        # generator/attack family, "-" for bonafide
    - source_corpus
    - sample_rate
    - duration_s
    - codec
    - split
    - language

audio:
  target_sample_rate: 16000
  mono: true
  crop_seconds: 4.0                     # 64000 samples at 16 kHz
  crop_strategy: random_train_center_eval
  pad_strategy: repeat

# In-the-Wild (Müller et al. 2022, arXiv:2203.16263) — eval-only, no official split, no
# generator labels. See Miscellaneous/research/knowledge/datasets/in-the-wild.md for the full note this
# block is derived from. Gitignored like `dataset.root` above: not downloaded yet, so code
# using this block must fail with an actionable DatasetNotFoundError, never a bare traceback.
in_the_wild:
  root: data/raw/InTheWild               # gitignored; extract the release here
  notes: >-
    Test only. 19,963 bona fide / 11,816 spoof, public-figure speech from the web; 54 speakers in
    meta.csv (the paper says 58). Scored raw.
  meta_file: meta.csv                    # columns: file,speaker,label ("spoof"|"bona-fide"); confirmed
                                         # on the extracted HF zip 2026-10-01 (release_in_the_wild/)
  expected_clips: 31779                  # confirmed locally 2026-10-01: 19,963 bona fide + 11,816 spoof.
                                         # meta.csv names 54 speakers; the paper says 58 (unresolved)
  license: CC-BY-SA-4.0                  # HF card; the authors' page says Apache-2.0 — unresolved
                                         # conflict (FC-plan-2026-09-30 3b), flag it in the report

# ASVspoof 2021 LA eval — test-only. Audio is 2019 LA-style speech sent through telephony
# channels. Labels come from the CM key released after the challenge (keys/LA/CM); the ASV key
# (speaker verification) and baseline score files under keys/ are not used.
# Key line: SPEAKER UTT_ID CODEC TRANSMISSION ATTACK LABEL TRIM PHASE
# PHASE eval (148,176 clips) is the official scoring subset; hidden (16,926) is already
# silence-trimmed by the organisers (TRIM=only_speech). One manifest per phase.
asvspoof2021:
  root: data/raw/ASVspoof2021            # gitignored; audio_dir and cm_key are relative to it
  notes: >-
    Test only. 2019-style attacks (A07-A19) sent over 7 telephony channels. Key phases: eval 148,176
    (official) / progress 16,464 / hidden 16,926 (silence removed by organisers). 18,452 bona fide /
    163,114 spoof. Scored raw, from the re-encoded flac_ffmpeg copy.
  # ffmpeg re-encode of ASVspoof2021_LA_eval/flac (scripts/reencode_flac.py): libsndfile cannot
  # decode ~30% of the original files; samples are bit-identical.
  audio_dir: ASVspoof2021_LA_eval/flac_ffmpeg
  cm_key: keys/LA/CM/trial_metadata.txt
  expected_clips: 181566                 # confirmed locally 2026-10-23: 18,452 bona fide + 163,114 spoof

# ASVspoof 2021 DF eval — test-only, from the Hugging Face mirror (SpeechAntiSpoofingBenchmarks/
# ASVspoof2021_DF) unpacked by `uv run download --asvspoof2021df`: flac/ plus labels.csv with the
# official labels/protocol. Audio is already re-encoded so libsndfile can read it (bit-exact).
# labels.csv `subset` is eval (official scoring subset) / progress / hidden. One manifest per subset.
asvspoof2021df:
  root: data/raw/ASVspoof2021/ASVspoof2021_DF_eval   # gitignored
  notes: >-
    Test only, Hugging Face mirror. Compressed media codecs and extra vocoders. Subsets: eval 533,928
    (official) / progress 59,325 / hidden 18,576. 22,617 bona fide / 589,212 spoof. Scored raw.
  labels: labels.csv
  expected_clips: 611829                 # official DF eval trial count; check after download

# MUSAN noise — not a spoof dataset; noise source for the eval_noise_10db condition
# (configs/e4_degradations.yaml: noise_dir reads the same folder).
musan:
  root: data/raw/musan/noise              # gitignored; `uv run download --musan`
  notes: >-
    Not a spoof dataset. Noise clips mixed into a fixed 10k subset of 2019 eval at 10 dB SNR to make
    eval_noise_10db (MP3, Opus and 8 kHz copies of the same subset need no extra data).

# SpoofCeleb — optional Stage 2 dataset. Its Hugging Face repository is gated; request access
# there, then extract the archive so the `flac`, `metadata`, and `protocol` directories are here.
# Audio is organized as flac/<split>/<attack_id>/<speaker_id>/<utterance>.flac; a00 is bona fide.
spoofceleb:
  root: data/raw/spoofceleb               # gitignored; extract the HF archive here
  source_url: https://huggingface.co/datasets/jungjee/spoofceleb
  license: CC-BY-4.0                      # HF dataset card
  audio_dir: flac
  metadata_dir: metadata
  metadata_files:
    train: train.csv
    development: development.csv
    evaluation: evaluation.csv
  protocol_dir: protocol
  protocol_files:
    sasv_development: sasv_development_evaluation_protocol.csv
    sasv_evaluation: sasv_evaluation_evaluation_protocol.csv
    sdd_development: sdd_development_evaluation_protocol.csv
    sdd_evaluation: sdd_evaluation_evaluation_protocol.csv
  training_subset:
    max_per_stratum: 100
    strata: [label, attack_id]

# PhonemeDF real speech and matched TTS/voice-converted recordings. Speaker-level splits keep
# source speakers and corresponding real/synthetic utterances together; reference audio and
# alignment textgrids are not model inputs.
phonemedf:
  root: data/raw/phonemedf
  real_audio_dir: PhonemeDF_real/real/wav
  tts_audio_dir: PhonemeDF_synthetic_tts/tts
  vc_audio_dir: PhonemeDF_synthetic_vc/vc
  split_seed: 1337
  training_subset:
    max_per_stratum: 100
    strata: [label, attack_id]

# Deterministic stratified subsampling (audio_df.data.manifests.stratified_subset). Recorded here so
# every caller uses the same seed/strata by default instead of each picking its own.
subsets:
  seed: 1337
  strata: [label, attack_id]

seed: 1337
