# Dataset location and protocol. No path here is assumed to exist: code must fail loudly
# with an actionable message when data is absent, and tests must run without it.
dataset:
  name: asvspoof2019_la
  root: data/raw/ASVspoof2019/LA        # gitignored; set to your local download
  protocol_dir: data/raw/ASVspoof2019/LA/ASVspoof2019_LA_cm_protocols
  splits:
    train: ASVspoof2019.LA.cm.train.trn.txt
    dev: ASVspoof2019.LA.cm.dev.trl.txt
    eval: ASVspoof2019.LA.cm.eval.trl.txt

manifest:
  out_dir: data/manifests
  columns:                              # Stage 0 requires all of these
    - utt_id
    - path
    - label            # bonafide | spoof
    - speaker_id
    - attack_id        # generator/attack family, "-" for bonafide
    - source_corpus
    - sample_rate
    - duration_s
    - codec
    - split
    - language

audio:
  target_sample_rate: 16000
  mono: true
  crop_seconds: 4.0                     # 64000 samples at 16 kHz
  crop_strategy: random_train_center_eval
  pad_strategy: repeat

# In-the-Wild (Müller et al. 2022, arXiv:2203.16263) — eval-only, no official split, no
# generator labels. See Miscellaneous/research/knowledge/datasets/in-the-wild.md for the full note this
# block is derived from. Gitignored like `dataset.root` above: not downloaded yet, so code
# using this block must fail with an actionable DatasetNotFoundError, never a bare traceback.
in_the_wild:
  root: data/raw/InTheWild               # gitignored; extract the release here
  meta_file: meta.csv                    # columns: file,speaker,label ("spoof"|"bona-fide"); confirmed
                                         # on the extracted HF zip 2026-10-01 (release_in_the_wild/)
  expected_clips: 31779                  # confirmed locally 2026-10-01: 19,963 bona fide + 11,816 spoof.
                                         # meta.csv names 54 speakers; the paper says 58 (unresolved)
  source_url: https://huggingface.co/datasets/mueller91/In-The-Wild
  license: CC-BY-SA-4.0                  # HF card; the authors' page says Apache-2.0 — unresolved
                                         # conflict (FC-plan-2026-09-30 3b), flag it in the report

# ASVspoof 2021 LA eval — test-only. Audio is 2019 LA-style speech sent through telephony
# channels. Labels come from the CM key released after the challenge (keys/LA/CM); the ASV key
# (speaker verification) and baseline score files under keys/ are not used.
# Key line: SPEAKER UTT_ID CODEC TRANSMISSION ATTACK LABEL TRIM PHASE
# PHASE eval (148,176 clips) is the official scoring subset; hidden (16,926) is already
# silence-trimmed by the organisers (TRIM=only_speech). One manifest per phase.
asvspoof2021:
  root: data/raw/ASVspoof2021            # gitignored; audio_dir and cm_key are relative to it
  audio_dir: ASVspoof2021_LA_eval/flac
  cm_key: keys/LA/CM/trial_metadata.txt
  expected_clips: 181566                 # confirmed locally 2026-10-23: 18,452 bona fide + 163,114 spoof
  source_url: https://www.asvspoof.org/index2021.html

# Deterministic stratified subsampling (audio_df.data.manifests.stratified_subset). Recorded here so
# every caller uses the same seed/strata by default instead of each picking its own.
subsets:
  seed: 1337
  strata: [label, attack_id]

seed: 1337
