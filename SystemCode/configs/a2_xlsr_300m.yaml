# System A2, XLS-R 300M backbone: frozen SSL -> learned layer-weighted head.
#
# XLS-R 300M has 24 transformer layers plus the feature-encoder/embedding output = 25
# hidden-state tensors under `output_hidden_states=True`, each of hidden size 1024 —
# confirmed directly from the model's own `config.json`
# (Miscellaneous/research/knowledge/methods/ssl-hidden-states.md). `run_a2.py` asserts the loaded model
# matches `model.n_layers`/`model.hidden_dim` before extracting anything.
#
# RAW ONLY: there is no trimmed training for XLS-R (nor for WavLM Base+ — see
# run_a2.py's module docstring); this config states it explicitly because XLS-R's
# extraction is by far the more expensive of the two (302M vs 94M parameters) and is meant
# to run overnight, unattended, and resumably (`extract --resume`) rather than be re-run
# under a second silence mode "just in case".
system: a2-xlsr

model:
  id: facebook/wav2vec2-xls-r-300m
  tag: xlsr-300m
  revision: null
  n_layers: 25          # embedding output + 24 transformer layers
  hidden_dim: 1024
  do_normalize: true    # XLS-R 300M's own preprocessor_config.json: do_normalize=true

preprocessing:
  sample_rate: 16000
  crop_seconds: 4.0      # 64000 samples -> 199 frames for this backbone's conv stride
  crop_mode: center       # center crop for EVERY split, including train (see run_a2.py doc)
  silence_mode: raw       # RAW ONLY for XLS-R (see header note above)

head:
  proj_dim: 256
  mlp_hidden: 128
  dropout: 0.1
  lr: 1.0e-3
  batch_size: 256
  max_epochs: 60
  patience: 8
  pos_weight: auto        # computed from the train split's bonafide:spoof ratio (~1:8.8)

data:
  train_manifest: data/manifests/train.csv
  testsets:
    dev: data/manifests/dev.csv
    eval: data/manifests/eval.csv
    itw: data/manifests/itw.csv

features:
  name: ssl_xlsr_300m_layer_weighted

cache_dir: data/cache/ssl
seed: 1337
