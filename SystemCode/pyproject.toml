[project]
name = "audio-df"
version = "0.1.0"
description = "EchoJEV: acoustic and SSL speech deepfake detection with evidence-based decision policies"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "typesafe-sdk>=0.7.5",
    "python-dotenv>=1.2.4",
    "laya>=0.4.15",
]

[project.scripts]
download = "scripts.download_data:main" # --asvspoof2019 | --asvspoof2021la | --asvspoof2021df | --musan | --itw | --all
data-check = "scripts.check_data:main" # --verify --paths
data-prepare = "scripts.prepare_data:main"
data-degrade = "scripts.make_degraded:main"
a1 = "audio_df.pipelines.a1:main"
a2 = "audio_df.pipelines.a2:main"
a3 = "audio_df.pipelines.a3:main"
a4 = "audio_df.pipelines.a4:main"
d1 = "audio_df.pipelines.d1:main"
d2 = "audio_df.pipelines.d2:main"
d3 = "audio_df.pipelines.d3:main"
fp1 = "audio_df.pipelines.fp1:main"
fp2 = "audio_df.pipelines.fp2:main"
a3-laya = "audio_df.pipelines.a3_laya:main"
p1 = "audio_df.pipelines.p1:main" # not an audio detection pipeline;
compare = "scripts.compare_policies:main"
evaluate-laya = "scripts.evaluate_laya_on_scores:main"

[project.optional-dependencies]
viz = ["seaborn>=0.13", "umap-learn>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
    "httpx>=0.28.1",
]

# CUDA wheels on Windows/Linux; macOS uses the standard PyPI builds.
# uv resolves the platform-specific sources into one lockfile.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_df", "src/backend", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs real audio data or a model download",
    "needs_data: requires ASVspoof under data/raw",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/audio_df", "src/backend"]
