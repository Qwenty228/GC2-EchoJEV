[project]
name = "audio-df"
version = "0.1.0"
description = "Audio deepfake detection workshop: handcrafted + self-supervised representations, benchmarked on ASVspoof protocols"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "librosa>=0.10.1",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "datasets>=2.18",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
adf = "audio_df.pipelines.run:main"

[project.optional-dependencies]
viz = ["seaborn>=0.13", "umap-learn>=0.5"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_df", "src/backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs real audio data or a model download",
    "needs_data: requires ASVspoof under data/raw",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/audio_df", "src/backend"]
