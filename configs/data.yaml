# Dataset location and protocol. No path here is assumed to exist: code must fail loudly
# with an actionable message when data is absent, and tests must run without it.
dataset:
  name: asvspoof2019_la
  root: data/raw/ASVspoof2019/LA        # gitignored; set to your local download
  protocol_dir: data/raw/ASVspoof2019/LA/ASVspoof2019_LA_cm_protocols
  splits:
    train: ASVspoof2019.LA.cm.train.trn.txt
    dev: ASVspoof2019.LA.cm.dev.trl.txt
    eval: ASVspoof2019.LA.cm.eval.trl.txt

manifest:
  out_dir: data/manifests
  columns:                              # Stage 0 requires all of these
    - utt_id
    - path
    - label            # bonafide | spoof
    - speaker_id
    - attack_id        # generator/attack family, "-" for bonafide
    - source_corpus
    - sample_rate
    - duration_s
    - codec
    - split
    - language

audio:
  target_sample_rate: 16000
  mono: true
  crop_seconds: 4.0                     # 64000 samples at 16 kHz
  crop_strategy: random_train_center_eval
  pad_strategy: repeat

# In-the-Wild (Müller et al. 2022, arXiv:2203.16263) — eval-only, no official split, no
# generator labels. See research/knowledge/datasets/in-the-wild.md for the full note this
# block is derived from. Gitignored like `dataset.root` above: not downloaded yet, so code
# using this block must fail with an actionable DatasetNotFoundError, never a bare traceback.
in_the_wild:
  root: data/raw/InTheWild               # gitignored; extract the release here
  meta_file: meta.csv                    # assumed columns: file,speaker,label ("spoof"|"bona-fide");
                                         # UNVERIFIED until the zip is extracted (FC-plan-2026-09-30 3d)
  expected_clips: 31779                  # figure from the project plan, NOT found in any primary
                                         # source (FC-plan-2026-09-30 3c); warn-only, confirm on download
  source_url: https://huggingface.co/datasets/mueller91/In-The-Wild
  license: CC-BY-SA-4.0                  # HF card; the authors' page says Apache-2.0 — unresolved
                                         # conflict (FC-plan-2026-09-30 3b), flag it in the report

# Deterministic stratified subsampling (audio_df.data.stratified_subset). Recorded here so
# every caller uses the same seed/strata by default instead of each picking its own.
subsets:
  seed: 1337
  strata: [label, attack_id]

seed: 1337
