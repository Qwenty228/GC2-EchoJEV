# Stage 10: fusion + shared trunk. Only run once Stage 2/4/6 evidence justifies the branches.
defaults: {data: configs/data.yaml, features: configs/features.yaml}

branch_handcrafted:
  representation: feat_b_lfcc_full    # replace with the empirically strongest Stage-2 variant
  backbone: resnet18_1ch
  pooling: statistics
  out_dim: 256

branch_ssl:
  checkpoint: facebook/wav2vec2-xls-r-300m
  frozen: true
  layer_weighting: learned_softmax
  pooling: statistics
  out_dim: 256

trunk: {in_dim: 512, hidden: 256, norm: layernorm, act: gelu, dropout: 0.2}

heads:
  detection: {type: binary, loss: bce_with_logits, weight: 1.0}
  auxiliary:
    enabled: false               # enable ONLY with a defensible dataset-provided label
    target: attack_family        # spoof-only; bonafide masked out of this loss
    weight: 0.3

diagnostics:
  gradient_cosine_similarity: {enabled: true, layers: [trunk.0]}

ablations:                       # required before any complementarity claim
  - handcrafted_only
  - ssl_only
  - concat_no_trunk
  - fusion_trunk_detection_only
  - fusion_trunk_multitask
  - ssl_final_layer_vs_learned_weights
  - pooling_mean_vs_stats_vs_attentive
